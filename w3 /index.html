                 <!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌸 可愛粉色泡泡迷因產生器 🌸</title>

    <!-- 引入 Google Fonts 可愛圓潤字體：Fredoka 與 M PLUS Rounded 1c -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">

    <!-- 引入 html2canvas CDN，用來將網頁畫面轉成圖片下載 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <!-- Tailwind CSS CDN -->
    <style>
        body {
            font-family: 'M PLUS Rounded 1c', 'Fredoka', sans-serif;
            background: linear-gradient(135deg, #ffd1dc 0%, #ffe6fa 50%, #e8dff5 100%);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* 背景飄浮粉色泡泡動畫 */
        .bubble-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .bubble {
            position: absolute;
            bottom: -100px;
            background: rgba(255, 255, 255, 0.4);
            border: 2px solid rgba(255, 182, 193, 0.6);
            border-radius: 50%;
            box-shadow: inset 0 0 10px rgba(255, 255, 255, 0.8), 0 4px 15px rgba(255, 105, 180, 0.2);
            animation: floatUp 12s infinite ease-in-out;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) scale(0.8) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.8;
            }
            90% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(-110vh) scale(1.2) rotate(360deg);
                opacity: 0;
            }
        }

        /* 玻璃擬物風格卡片 (Glassmorphism) */
        .glass-card {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 10px 30px rgba(255, 154, 162, 0.25);
        }

        /* 自定義滑桿粉紅外觀 */
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            background: #ffd3e2;
            height: 8px;
            border-radius: 5px;
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #ff6b95;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(255, 107, 149, 0.6);
            transition: transform 0.2s;
        }
        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        /* 迷因文字描邊特效類別 */
        .meme-text {
            word-wrap: break-word;
            line-height: 1.2;
            user-select: none;
        }

        /* 可愛粉彩按鈕點擊效果 */
        .btn-pink {
            background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
            box-shadow: 0 6px 18px rgba(255, 117, 140, 0.4);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .btn-pink:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 10px 22px rgba(255, 117, 140, 0.5);
        }
        .btn-pink:active {
            transform: translateY(1px) scale(0.98);
        }
    </style>
</head>
<body class="p-4 md:p-8 flex items-center justify-center">

    <!-- 動態背景泡泡元素 -->
    <div class="bubble-container" id="bubbleContainer"></div>

    <!-- 主要內容包裹外框 (RWD 響應式佈局) -->
    <div class="relative z-10 w-full max-w-6xl mx-auto">
        
        <!-- 頁頭標題區 -->
        <header class="text-center mb-8">
            <h1 class="text-3xl md:text-5xl font-extrabold text-pink-600 drop-shadow-md tracking-wider flex items-center justify-center gap-2">
                <span>🫧</span> 可愛粉色泡泡迷因產生器 <span>✨</span>
            </h1>
            <p class="text-pink-500 font-semibold mt-2 text-sm md:text-base">
                上傳專屬圖片、自由加上超萌文字，一鍵打包下載專屬 Meme！
            </p>
        </header>

        <!-- 主體網格佈局：電腦版左控制右預覽，手機版上下疊加 -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
            
            <!-- 👈 左側：控制面板區 (5 欄寬) -->
            <section class="lg:col-span-5 glass-card rounded-3xl p-6 flex flex-col gap-5">
                <div class="flex items-center gap-2 border-b-2 border-pink-200 pb-3">
                  </label>
                    <label for="imageLoader" class="flex flex-col items-center justify-center w-full h-28 border-2 border-dashed border-pink-300 rounded-2xl cursor-pointer bg-pink-50/50 hover:bg-pink-100/60 transition">
                        <div class="flex flex-col items-center justify-center pt-2 pb-3">
                            <span class="text-3xl mb-1">☁️</span>
                            <p class="text-xs text-pink-500 font-bold">點擊或拖曳本機圖片到這裡</p>
                            <p class="text-[10px] text-pink-400 mt-1">支援 PNG, JPG, WEBP 格式</p>
                        </div>
                        <!-- 隱藏原生 input，改用可愛拖曳區包覆 -->
                        <input id="imageLoader" type="file" accept="image/*" class="hidden" />
                    </label>
                </div>

                <!-- 2. 上方文字輸入 -->
                <div>
                    <label for="topTextInput" class="block text-pink-700 font-bold mb-1">✏️ 上方文字：</label>
                    <input type="text" id="topTextInput" placeholder="輸入上方文字..." 
                        value="當你發現這個迷因產生器" 
                        class="w-full px-4 py-2.5 rounded-xl border-2 border-pink-200 focus:border-pink-400 focus:outline-none bg-white/80 text-gray-700 font-semibold transition shadow-inner">
                </div>

                <!-- 3. 下方文字輸入 -->
                <div>
                    <label for="bottomTextInput" class="block text-pink-700 font-bold mb-1">✏️ 下方文字：</label>
                    <input type="text" id="bottomTextInput" placeholder="輸入下方文字..." 
                        value="實在是太可愛了！" 
                        class="w-full px-4 py-2.5 rounded-xl border-2 border-pink-200 focus:border-pink-400 focus:outline-none bg-white/80 text-gray-700 font-semibold transition shadow-inner">
                </div>

                <!-- 4. 文字大小滑桿 -->
                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label for="fontSizeSlider" class="text-pink-700 font-bold">🔤 字體大小：</label>
                        <span id="fontSizeVal" class="text-xs font-extrabold text-pink-500 bg-pink-100 px-2 py-0.5 rounded-full">36px</span>
                    </div>
                    <input type="range" id="fontSizeSlider" min="16" max="72" value="36" class="w-full">
                </div>

                <!-- 5. 上方文字垂直位置調整滑桿 -->
                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label for="topPosSlider" class="text-pink-700 font-bold">⬆️ 上方文字垂直位置：</label>
                        <span id="topPosVal" class="text-xs font-extrabold text-pink-500 bg-pink-100 px-2 py-0.5 rounded-full">5%</span>
                    </div>
                    <input type="range" id="topPosSlider" min="0" max="40" value="5" class="w-full">
                </div>

                <!-- 6. 下方文字垂直位置調整滑桿 -->
                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label for="bottomPosSlider" class="text-pink-700 font-bold">⬇️ 下方文字垂直位置：</label>
                        <span id="bottomPosVal" class="text-xs font-extrabold text-pink-500 bg-pink-100 px-2 py-0.5 rounded-full">5%</span>
                    </div>
                    <input type="range" id="bottomPosSlider" min="0" max="40" value="5" class="w-full">
                </div>

                <!-- 7. 顏色選取器 (文字顏色 & 描邊顏色) -->
                <div class="grid grid-cols-2 gap-4 pt-2">
                    <div>
                        <label for="textColor" class="block text-pink-700 font-bold text-xs mb-1">🎨 文字顏色：</label>
                        <input type="color" id="textColor" value="#ffffff" class="w-full h-10 rounded-xl cursor-pointer border-2 border-pink-200 bg-white">
                    </div>
                    <div>
                        <label for="strokeColor" class="block text-pink-700 font-bold text-xs mb-1">✍️ 邊框顏色：</label>
                        <input type="color" id="strokeColor" value="#000000" class="w-full h-10 rounded-xl cursor-pointer border-2 border-pink-200 bg-white">
                    </div>
                </div>

                <!-- 8. 超酷下載按鈕 -->
                <button id="downloadBtn" class="btn-pink w-full py-3.5 mt-2 rounded-2xl text-white font-extrabold text-lg flex items-center justify-center gap-2 cursor-pointer">
                    <span>💖</span> 一鍵下載迷因圖 (my-meme.png)
                </button>
            </section>

            <!-- 👉 右側：迷因即時預覽區 (7 欄寬) -->
            <section class="lg:col-span-7 flex flex-col items-center justify-center sticky top-6">
                <div class="glass-card p-4 rounded-3xl w-full flex flex-col items-center">
                    <div class="flex items-center gap-2 border-b-2 border-pink-200 w-full pb-3 mb-4 justify-between">
                        <div class="flex items-center gap-2">
                            <span class="text-2xl">🖼️</span>
                            <h2 class="text-xl font-bold text-pink-600">即時預覽區</h2>
                        </div>
                        <span class="text-xs bg-pink-200 text-pink-700 font-bold px-3 py-1 rounded-full">Live Preview</span>
                    </div>

                    <!-- 截圖目標區塊 (html2canvas 會擷取這個 id="memeContainer" 的區域) -->
                    <div id="memeContainer" class="relative overflow-hidden rounded-2xl bg-slate-900 shadow-xl max-w-full flex justify-center items-center select-none" style="min-height: 320px;">
                        
                        <!-- 迷因底圖 -->
                        <img id="memeImage" src="" alt="迷因底圖" class="w-full h-auto object-contain block max-h-[600px]" />

                        <!-- 上方文字圖層 -->
                        <div id="topTextDisplay" class="meme-text absolute left-0 right-0 text-center font-extrabold uppercase px-4 pointer-events-none tracking-wide" style="top: 5%;">
                            當你發現這個迷因產生器
                        </div>

                        <!-- 下方文字圖層 -->
                        <div id="bottomTextDisplay" class="meme-text absolute left-0 right-0 text-center font-extrabold uppercase px-4 pointer-events-none tracking-wide" style="bottom: 5%;">
                            實在是太可愛了！
                        </div>
                    </div>

                    <p class="text-xs text-pink-400 mt-3 font-semibold text-center">
                        💡 提示：調整左側參數即可同步在此即時顯示效果喔！
                    </p>
                </div>
            </section>
        </div>
    </div>

    <!-- JavaScript 邏輯處理 -->
    <script>
        // ==========================================
        // 1. 取得 DOM 元素 (HTML 中的各個控制元件)
        // ==========================================
        const imageLoader = document.getElementById('imageLoader');
        const memeImage = document.getElementById('memeImage');
        const memeContainer = document.getElementById('memeContainer');

        const topTextInput = document.getElementById('topTextInput');
        const bottomTextInput = document.getElementById('bottomTextInput');
        const topTextDisplay = document.getElementById('topTextDisplay');
        const bottomTextDisplay = document.getElementById('bottomTextDisplay');

        const fontSizeSlider = document.getElementById('fontSizeSlider');
        const fontSizeVal = document.getElementById('fontSizeVal');
        const topPosSlider = document.getElementById('topPosSlider');
        const topPosVal = document.getElementById('topPosVal');
        const bottomPosSlider = document.getElementById('bottomPosSlider');
        const bottomPosVal = document.getElementById('bottomPosVal');

        const textColor = document.getElementById('textColor');
        const strokeColor = document.getElementById('strokeColor');
        const downloadBtn = document.getElementById('downloadBtn');

        // ==========================================
        // 2. 初始化生成背景飄浮泡泡效果
        // ==========================================
        function createBubbles() {
            const container = document.getElementById('bubbleContainer');
            const bubbleCount = 15; // 泡泡數量

            for (let i = 0; i < bubbleCount; i++) {
                const bubble = document.createElement('div');
                bubble.classList.add('bubble');
                
                // 隨機尺寸 (20px - 80px)
                const size = Math.random() * 60 + 20;
                bubble.style.width = `${size}px`;
                bubble.style.height = `${size}px`;
                
                // 隨機水平位置 (0% - 100%)
                bubble.style.left = `${Math.random() * 100}%`;
                
                // 隨機動畫延遲與持續時間
                bubble.style.animationDelay = `${Math.random() * 8}s`;
                bubble.style.animationDuration = `${Math.random() * 8 + 8}s`;
                
                container.appendChild(bubble);
            }
        }

        // ==========================================
        // 3. 預設預設預覽圖片 (使用 SVG Data URI 確保初始化有畫面)
        // ==========================================
        function loadDefaultImage() {
            // 繪製一個可愛粉色風格的預設背景圖
            const defaultSvg = `
                <svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
                    <defs>
                        <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#ff9a9e" />
                            <stop offset="100%" stop-color="#fecfef" />
                        </linearGradient>
                    </defs>
                    <rect width="100%" height="100%" fill="url(#bg)"/>
                    <circle cx="300" cy="180" r="70" fill="#ffffff" opacity="0.8"/>
                    <circle cx="280" cy="170" r="8" fill="#333"/>
                    <circle cx="320" cy="170" r="8" fill="#333"/>
                    <path d="M 285 200 Q 300 215 315 200" stroke="#333" stroke-width="4" fill="none" stroke-linecap="round"/>
                    <ellipse cx="265" cy="185" rx="10" ry="6" fill="#ff758c" opacity="0.6"/>
                    <ellipse cx="335" cy="185" rx="10" ry="6" fill="#ff758c" opacity="0.6"/>
                    <text x="50%" y="85%" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#ffffff" opacity="0.9">✨ 上傳圖片開始創作你的專屬迷因 ✨</text>
                </svg>
            `;
            memeImage.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(defaultSvg);
        }

        // ==========================================
        // 4. 本機圖片讀取核心 (FileReader API 避開 CORS 錯誤)
        // ==========================================
        imageLoader.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            // 建立 FileReader 物件
            const reader = new FileReader();

            // 當檔案讀取完成後觸發
            reader.onload = function(event) {
                // 將讀取到的 DataURL 賦予給圖片 src
                memeImage.src = event.target.result;
            };

            // 以 DataURL 格式讀取本機影像檔案
            reader.readAsDataURL(file);
        });

        // ==========================================
        // 5. 即時更新迷因文字與樣式函數
        // ==========================================
        function updateMemeText() {
            // 更新文字內容
            topTextDisplay.innerText = topTextInput.value;
            bottomTextDisplay.innerText = bottomTextInput.value;

            // 更新字體大小
            const currentFontSize = fontSizeSlider.value;
            topTextDisplay.style.fontSize = `${currentFontSize}px`;
            bottomTextDisplay.style.fontSize = `${currentFontSize}px`;
            fontSizeVal.innerText = `${currentFontSize}px`;

            // 更新垂直位置
            topTextDisplay.style.top = `${topPosSlider.value}%`;
            topPosVal.innerText = `${topPosSlider.value}%`;

            bottomTextDisplay.style.bottom = `${bottomPosSlider.value}%`;
            bottomPosVal.innerText = `${bottomPosSlider.value}%`;

            // 更新文字顏色
            topTextDisplay.style.color = textColor.value;
            bottomTextDisplay.style.color = textColor.value;

            // 利用多重 text-shadow 打造高品質實體粗描邊 (黑色或自訂邊框色)
            const stroke = strokeColor.value;
            const shadowStyle = `
                -2px -2px 0 ${stroke},
                 2px -2px 0 ${stroke},
                -2px  2px 0 ${stroke},
                 2px  2px 0 ${stroke},
                 0px  3px 6px rgba(0,0,0,0.5)
            `;
            topTextDisplay.style.textShadow = shadowStyle;
            bottomTextDisplay.style.textShadow = shadowStyle;
        }

        // 綁定輸入事件（當使用者打字或拖曳滑桿時即時觸發）
        topTextInput.addEventListener('input', updateMemeText);
        bottomTextInput.addEventListener('input', updateMemeText);
        fontSizeSlider.addEventListener('input', updateMemeText);
        topPosSlider.addEventListener('input', updateMemeText);
        bottomPosSlider.addEventListener('input', updateMemeText);
        textColor.addEventListener('input', updateMemeText);
        strokeColor.addEventListener('input', updateMemeText);

        // ==========================================
        // 6. 一鍵截圖並下載圖檔 (html2canvas)
        // ==========================================
        downloadBtn.addEventListener('click', function() {
            // 變更按鈕狀態，給予使用者即時視覺回饋
            const originalBtnText = downloadBtn.innerHTML;
            downloadBtn.innerHTML = `<span>⏳</span> 正在生成可愛迷因中...`;
            downloadBtn.style.opacity = '0.8';
            downloadBtn.disabled = true;

            // 使用 html2canvas 擷取 #memeContainer 區域
            html2canvas(memeContainer, {
                useCORS: true,      // 允許跨域標籤（搭配本機 FileReader 使用更順暢）
                scale: 2,           // 提高下載圖片解析度 (2倍超高清)
                backgroundColor: null // 保持透明背景（若有透明區域）
            }).then(canvas => {
                // 將 Canvas 轉換為圖片 Data URL
                const imageUrl = canvas.toDataURL('image/png');

                // 建立一個隱藏的 <a> 標籤來實現自動下載
                const downloadLink = document.createElement('a');
                downloadLink.href = imageUrl;
                downloadLink.download = 'my-meme.png'; // 下載檔名

                // 觸發點擊下載
                document.body.appendChild(downloadLink);
                downloadLink.click();
                document.body.removeChild(downloadLink);

                // 恢復按鈕原本狀態
                downloadBtn.innerHTML = originalBtnText;
                downloadBtn.style.opacity = '1';
                downloadBtn.disabled = false;
            }).catch(err => {
                console.error("生成失敗：", err);
                alert("生成迷因圖時發生錯誤，請重試！");
                downloadBtn.innerHTML = originalBtnText;
                downloadBtn.style.opacity = '1';
                downloadBtn.disabled = false;
            });
        });

        // ==========================================
        // 7. 頁面初始化載入
        // ==========================================
        window.onload = function() {
            createBubbles();
            loadDefaultImage();
            updateMemeText();
        };
    </script>
</body>
</html>
