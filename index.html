<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>夢幻馬卡龍作品集入口 🌸 Macaron Portfolio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Fredoka', 'Quicksand', 'Nunito', 'Microsoft JhengHei', sans-serif;
        }

        :root {
            /* 夢幻馬卡龍主題色 */
            --sakura-pink: #ffb3c6;
            --deep-sakura: #ff85a1;
            --milk-yellow: #fff3bf;
            --accent-yellow: #ffd43b;
            --pastel-blue: #a5d8ff;
            --accent-blue: #74c0fc;
            --mint-green: #b2f2bb;
            --accent-green: #69db7c;
            --milk-white: rgba(255, 255, 255, 0.9);
            
            --text-dark: #5c4d51;
            --text-muted: #9e8d92;
            
            /* 蓬鬆綿密馬卡龍陰影 */
            --macaron-shadow: 0 12px 30px rgba(255, 133, 161, 0.22);
            --card-inset-shadow: inset 0 0 15px rgba(255, 255, 255, 0.8);
        }

        body {
            min-height: 100vh;
            /* 溫柔粉嫩馬卡龍漸層背景 */
            background: linear-gradient(135deg, #ffdeeb 0%, #edf2ff 40%, #e6fcf5 80%, #fff9db 100%);
            color: var(--text-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2.5rem 1rem;
            position: relative;
            overflow-x: hidden;
        }

        /* 1. 漂浮雲朵動畫 */
        .cloud {
            position: fixed;
            background: rgba(255, 255, 255, 0.75);
            border-radius: 50px;
            z-index: 0;
            pointer-events: none;
            filter: drop-shadow(0 8px 15px rgba(255, 182, 193, 0.2));
            animation: floatCloud 25s linear infinite;
        }

        .cloud::before, .cloud::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.75);
            border-radius: 50%;
        }

        .cloud-1 {
            width: 140px;
            height: 45px;
            top: 8%;
            left: -180px;
            animation-duration: 28s;
        }
        .cloud-1::before { width: 60px; height: 60px; top: -25px; left: 20px; }
        .cloud-1::after { width: 45px; height: 45px; top: -15px; left: 65px; }

        .cloud-2 {
            width: 180px;
            height: 55px;
            top: 68%;
            left: -220px;
            animation-duration: 35s;
            animation-delay: 6s;
        }
        .cloud-2::before { width: 80px; height: 80px; top: -35px; left: 30px; }
        .cloud-2::after { width: 60px; height: 60px; top: -20px; left: 85px; }

        @keyframes floatCloud {
            0% { transform: translateX(0); }
            100% { transform: translateX(calc(100vw + 350px)); }
        }

        /* 2. 微光閃爍星星 */
        .star {
            position: fixed;
            background: var(--accent-yellow);
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
            z-index: 0;
            pointer-events: none;
            animation: twinkle 3s ease-in-out infinite alternate;
        }

        .star-1 { width: 22px; height: 22px; top: 12%; right: 15%; animation-delay: 0s; }
        .star-2 { width: 16px; height: 16px; top: 30%; left: 8%; animation-delay: 1.2s; }
        .star-3 { width: 26px; height: 26px; bottom: 18%; right: 10%; animation-delay: 0.6s; }
        .star-4 { width: 18px; height: 18px; bottom: 10%; left: 14%; animation-delay: 1.8s; }

        @keyframes twinkle {
            0% { transform: scale(0.7) rotate(0deg); opacity: 0.3; filter: drop-shadow(0 0 2px var(--accent-yellow)); }
            100% { transform: scale(1.1) rotate(15deg); opacity: 0.9; filter: drop-shadow(0 0 8px var(--accent-yellow)); }
        }

        /* 3. 飄落氣泡動畫 */
        .bubbles-container {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .bubble {
            position: absolute;
            bottom: -60px;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.9), rgba(255, 179, 198, 0.4));
            border-radius: 50%;
            border: 1.5px solid rgba(255, 255, 255, 0.6);
            animation: riseBubble 12s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        .bubble-1 { width: 35px; height: 35px; left: 10%; animation-duration: 11s; animation-delay: 0s; }
        .bubble-2 { width: 25px; height: 25px; left: 30%; animation-duration: 14s; animation-delay: 3s; }
        .bubble-3 { width: 45px; height: 45px; left: 60%; animation-duration: 16s; animation-delay: 1s; }
        .bubble-4 { width: 20px; height: 20px; left: 85%; animation-duration: 10s; animation-delay: 5s; }

        @keyframes riseBubble {
            0% { transform: translateY(0) scale(0.8) rotate(0deg); opacity: 0; }
            20% { opacity: 0.7; }
            80% { opacity: 0.7; }
            100% { transform: translateY(-110vh) scale(1.2) rotate(360deg); opacity: 0; }
        }

        .container {
            width: 100%;
            max-width: 980px;
            background: var(--milk-white);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 5px solid #ffffff;
            border-radius: 36px; /* 圓滾滾大圓角 */
            padding: 3rem 2rem;
            box-shadow: var(--macaron-shadow), var(--card-inset-shadow);
            position: relative;
            z-index: 1;
        }

        .profile-section {
            text-align: center;
            margin-bottom: 2.8rem;
        }

        .avatar-container {
            position: relative;
            width: 135px;
            height: 135px;
            margin: 0 auto 1.2rem;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            /* 櫻花粉/牛奶黃雙色漸層邊框 */
            border: 6px solid #ffffff;
            background: linear-gradient(135deg, var(--sakura-pink), var(--milk-yellow));
            box-shadow: 0 10px 22px rgba(255, 133, 161, 0.35);
            animation: bounceSoft 3.5s ease-in-out infinite;
        }

        /* 溫柔浮動動畫 */
        @keyframes bounceSoft {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(2deg); }
        }

        .avatar-badge {
            position: absolute;
            bottom: -2px;
            right: -2px;
            background: linear-gradient(45deg, var(--milk-yellow), var(--accent-yellow));
            border: 3px solid #ffffff;
            border-radius: 20px;
            padding: 0.3rem 0.8rem;
            font-size: 0.82rem;
            font-weight: 800;
            color: #8c5b00;
            box-shadow: 0 4px 12px rgba(255, 212, 59, 0.4);
        }

        .user-name {
            font-size: 2.3rem;
            font-weight: 800;
            color: var(--deep-sakura);
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
            text-shadow: 2px 2px 0px #ffffff, 4px 4px 10px rgba(255, 133, 161, 0.2);
        }

        .sub-title {
            display: inline-block;
            font-size: 0.95rem;
            font-weight: 800;
            color: #4c6ef5;
            background: linear-gradient(135deg, #dbe4ff 0%, #edf2ff 100%);
            border: 2px solid #bac8ff;
            padding: 0.35rem 1.2rem;
            border-radius: 25px;
            box-shadow: 0 4px 10px rgba(116, 192, 252, 0.2);
        }

        .grid-menu {
            display: grid;
            grid-template-columns: repeat(4, 1fr); /* 電腦版 4 列 */
            gap: 1.25rem;
        }

        .btn-card {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 115px;
            padding: 1.1rem 0.8rem;
            border-radius: 28px; /* 馬卡龍圓滾角 */
            text-decoration: none;
            position: relative;
            transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-align: center;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.03);
            border: 3.5px solid #ffffff;
        }

        .btn-card .week-tag {
            font-size: 0.8rem;
            font-weight: 800;
            text-transform: uppercase;
            padding: 0.25rem 0.7rem;
            border-radius: 14px;
            margin-bottom: 0.45rem;
        }

        .btn-card .title {
            font-size: 0.95rem;
            font-weight: 700;
            line-height: 1.35;
        }

        /* --- 🌸 已解鎖按鈕 (Unlocked - 馬卡龍亮色) --- */
        .btn-card.unlocked-1 {
            background: linear-gradient(135deg, #ffffff 40%, #e6fcf5 100%);
            border-color: var(--mint-green);
            color: var(--text-dark);
        }
        .btn-card.unlocked-1 .week-tag {
            background: var(--mint-green);
            color: #2b8a3e;
        }

        .btn-card.unlocked-2 {
            background: linear-gradient(135deg, #ffffff 40%, #fff9db 100%);
            border-color: var(--milk-yellow);
            color: var(--text-dark);
        }
        .btn-card.unlocked-2 .week-tag {
            background: var(--accent-yellow);
            color: #a67c00;
        }

        /* Jelly Bounce 果凍 Q 彈 Hover 動畫 */
        .btn-card.unlocked:hover {
            transform: scale(1.08) translateY(-6px);
            border-color: var(--deep-sakura);
            /* 馬卡龍亮色漸層光暈 */
            box-shadow: 0 15px 30px rgba(255, 133, 161, 0.4), inset 0 0 12px rgba(255, 255, 255, 0.9);
            animation: jellyBounce 0.6s ease-in-out;
        }

        .btn-card.unlocked:hover .week-tag {
            background: var(--deep-sakura);
            color: #ffffff;
            box-shadow: 0 3px 8px rgba(255, 133, 161, 0.3);
        }

        @keyframes jellyBounce {
            0% { transform: scale(1) translateY(0); }
            30% { transform: scale(1.12, 0.9) translateY(-8px); }
            50% { transform: scale(0.95, 1.05) translateY(-6px); }
            70% { transform: scale(1.05, 0.98) translateY(-6px); }
            100% { transform: scale(1.08) translateY(-6px); }
        }

        /* --- 🔒 未解鎖按鈕 (Locked - 灰色馬卡龍質感 Soft Muted) --- */
        .btn-card.locked {
            background: linear-gradient(135deg, #f8f9fa 0%, #f1f3f5 100%);
            border-color: #e9ecef;
            color: var(--text-muted);
            cursor: not-allowed;
            user-select: none;
            opacity: 0.88;
        }

        .btn-card.locked .week-tag {
            background: #e9ecef;
            color: #adb5bd;
        }

        .btn-card.locked .lock-emoji {
            font-size: 1.6rem;
            margin-bottom: 0.25rem;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.08));
        }

        /* Jelly Shake 未解鎖左右軟彈搖晃懸停動畫 */
        .btn-card.locked:hover {
            background: linear-gradient(135deg, #fff0f3 0%, #f8f9fa 100%);
            border-color: var(--sakura-pink);
            animation: jellyShake 0.5s ease-in-out;
        }

        .btn-card.locked:hover .lock-emoji {
            transform: scale(1.25) rotate(-12deg);
        }

        @keyframes jellyShake {
            0%, 100% { transform: translateX(0) rotate(0deg); }
            20% { transform: translateX(-7px) rotate(-4deg); }
            40% { transform: translateX(7px) rotate(4deg); }
            60% { transform: translateX(-4px) rotate(-2deg); }
            80% { transform: translateX(4px) rotate(2deg); }
        }

        @media (max-width: 880px) {
            .grid-menu {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 600px) {
            .container {
                padding: 2.2rem 1.2rem;
                border-radius: 30px;
            }

            .user-name {
                font-size: 1.85rem;
            }

            .grid-menu {
                grid-template-columns: repeat(2, 1fr); /* 手機版 2 列 */
                gap: 0.9rem;
            }

            .btn-card {
                min-height: 102px;
                padding: 0.85rem 0.5rem;
                border-radius: 22px;
            }

            .btn-card .title {
                font-size: 0.85rem;
            }
        }
    </style>
</head>
