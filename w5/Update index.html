<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雲端心電感應 💖 Telepathy Game</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        notion: {
                            bg: '#fdfbfb',
                            card: '#ffffff',
                            pinkLight: '#fff0f5',
                            pinkSubtle: '#fce7f3',
                            pinkSoft: '#f472b6',
                            pinkMain: '#ec4899',
                            pinkHover: '#db2777',
                            text: '#374151',
                            subtext: '#6b7280',
                            border: '#f3e8ff'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'PingFang TC', 'Microsoft JhengHei', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* 3D 翻牌特效 CSS */
        .perspective-1000 {
            perspective: 1000px;
        }
        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-style: preserve-3d;
        }
        .card-inner.flipped {
            transform: rotateY(180deg);
        }
        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 1rem;
        }
        .card-front {
            /* 蓋牌狀態 */
            transform: rotateY(0deg);
        }
        .card-back {
            /* 開牌狀態 */
            transform: rotateY(180deg);
        }
        
        /* 可愛漂浮動畫 */
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(3deg); }
        }
        .animate-float {
            animation: float 3s ease-in-out infinite;
        }
        
        /* 脈衝點狀指示器 */
        .pulse-dot {
            box-shadow: 0 0 0 0 rgba(236, 72, 153, 0.7);
            animation: pulse 1.6s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(236, 72, 153, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(236, 72, 153, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(236, 72, 153, 0); }
        }
    </style>
</head>
<body class="bg-notion-pinkLight text-notion-text font-sans min-h-screen flex flex-col justify-between selection:bg-notion-pinkSubtle selection:text-notion-pinkMain">

    <!-- 頂部導航列 -->
    <header class="w-full max-w-4xl mx-auto p-4 flex justify-between items-center border-b border-notion-pinkSubtle/60">
        <div class="flex items-center space-x-2 cursor-pointer" onclick="resetToLobby()">
            <span class="text-2xl animate-float">💖</span>
            <span class="font-bold text-lg tracking-tight text-notion-pinkMain">雲端心電感應</span>
            <span class="text-xs bg-notion-pinkSubtle text-notion-pinkMain px-2 py-0.5 rounded-full font-medium">v1.0</span>
        </div>
        
        <!-- 右側狀態與隱藏房主開關 -->
        <div id="navRight" class="hidden flex items-center space-x-3">
            <div id="roomBadge" class="text-xs bg-white border border-notion-pinkSubtle shadow-sm rounded-lg px-2.5 py-1 text-notion-subtext flex items-center gap-1.5">
                <span class="pulse-dot w-2 h-2 rounded-full bg-notion-pinkMain inline-block"></span>
                <span>房號: <strong id="displayRoomCode" class="text-notion-pinkMain font-mono">---</strong></span>
            </div>

            <div id="userBadge" class="text-xs bg-white border border-notion-pinkSubtle shadow-sm rounded-lg px-2.5 py-1 text-notion-subtext">
                玩家: <span id="displayNickname" class="font-semibold text-gray-800">---</span>
            </div>

            <!-- 隱藏房主切換鈕 (小圖示/按鈕) -->
            <button id="toggleHostBtn" title="切換隱藏房主模式" onclick="toggleHostRole()" 
                class="p-2 rounded-lg bg-white border border-notion-pinkSubtle hover:bg-notion-pinkSubtle text-notion-subtext hover:text-notion-pinkMain transition shadow-sm text-xs flex items-center gap-1">
                <i class="fa-solid fa-crown text-amber-400"></i>
                <span id="roleLabel" class="hidden sm:inline">玩家</span>
            </button>
        </div>
    </header>

    <!-- 主內容區域 -->
    <main class="w-full max-w-3xl mx-auto p-4 sm:p-6 flex-grow flex flex-col justify-center">

        <!-- 1. 登入/大廳 (Room Entry / Setup) -->
        <section id="lobbySection" class="bg-white rounded-2xl p-6 sm:p-10 shadow-xl border border-notion-pinkSubtle/80 max-w-md mx-auto w-full transition-all duration-300">
            <div class="text-center mb-6">
                <div class="inline-block p-4 rounded-full bg-notion-pinkLight mb-3">
                    <i class="fa-solid fa-wand-magic-sparkles text-3xl text-notion-pinkMain"></i>
                </div>
                <h1 class="text-2xl font-bold text-gray-800 mb-1">開始默契挑戰</h1>
                <p class="text-xs text-notion-subtext">輸入房間號碼與同學一同步開牌！</p>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1 ml-1">暱稱 / 姓名</label>
                    <input type="text" id="inputNickname" placeholder="例如：小明" 
                        class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-notion-pinkSoft/50 focus:border-notion-pinkSoft text-sm transition">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1 ml-1">房間代碼 (4位數)</label>
                    <div class="flex gap-2">
                        <input type="text" id="inputRoomCode" maxlength="6" placeholder="例如：8888" 
                            class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-notion-pinkSoft/50 focus:border-notion-pinkSoft text-sm font-mono uppercase tracking-wider transition">
                        <button onclick="generateRandomRoom()" class="px-3 py-2.5 bg-notion-pinkLight hover:bg-notion-pinkSubtle text-notion-pinkMain rounded-xl text-xs font-medium border border-notion-pinkSubtle whitespace-nowrap transition">
                            隨機
                        </button>
                    </div>
                </div>

                <div class="pt-2 space-y-2">
                    <button onclick="joinRoom(false)" class="w-full py-3 bg-notion-pinkMain hover:bg-notion-pinkHover text-white font-semibold rounded-xl text-sm shadow-md shadow-notion-pinkMain/20 transition transform active:scale-98">
                        加入房間 (玩家)
                    </button>
                    <button onclick="joinRoom(true)" class="w-full py-2.5 bg-white border border-notion-pinkSubtle text-notion-pinkMain hover:bg-notion-pinkLight font-medium rounded-xl text-sm transition flex items-center justify-center gap-1.5">
                        <i class="fa-solid fa-crown text-amber-400"></i> 我是房主 (建立/控制)
                    </button>
                </div>
            </div>
        </section>

        <!-- 2. 遊戲房間主要區域 -->
        <section id="gameSection" class="hidden space-y-6">

            <!-- 房主主控台卡片 (可隱藏/展開) -->
            <div id="hostConsole" class="hidden bg-white border-2 border-notion-pinkSoft/40 rounded-2xl p-5 shadow-sm space-y-3 transition">
                <div class="flex justify-between items-center border-b border-gray-100 pb-2">
                    <span class="text-xs font-bold text-notion-pinkMain flex items-center gap-1.5">
                        <i class="fa-solid fa-crown text-amber-400"></i> 房主控制台 (Host Panel)
                    </span>
                    <span class="text-[11px] bg-amber-50 text-amber-700 px-2 py-0.5 rounded border border-amber-200">主控權中</span>
                </div>

                <!-- 階段 1: 出題區 -->
                <div id="hostSetupControls" class="space-y-2">
                    <label class="block text-xs font-medium text-gray-600">設定本輪題目：</label>
                    <div class="flex gap-2">
                        <input type="text" id="inputQuestion" placeholder="例如：提到夏天會聯想到什麼水果？" 
                            class="flex-grow px-3.5 py-2 rounded-xl border border-gray-200 text-sm focus:outline-none focus:ring-2 focus:ring-notion-pinkSoft/40">
                        <button onclick="setQuestion()" class="px-4 py-2 bg-notion-pinkMain hover:bg-notion-pinkHover text-white text-xs font-semibold rounded-xl shadow transition whitespace-nowrap">
                            發布題目 🚀
                        </button>
                    </div>
                </div>

                <!-- 階段 2 & 3: 遊戲控制 (開牌 / 重置) -->
                <div id="hostActionControls" class="hidden flex flex-wrap gap-2 pt-1">
                    <button id="btnReveal" onclick="revealAnswers()" class="flex-1 py-2 bg-emerald-500 hover:bg-emerald-600 text-white text-xs font-bold rounded-xl shadow transition flex justify-center items-center gap-1">
                        <i class="fa-solid fa-eye"></i> 全員開牌 (3D翻牌)
                    </button>
                    <button onclick="resetRound()" class="py-2 px-4 bg-gray-100 hover:bg-gray-200 text-gray-600 text-xs font-semibold rounded-xl transition flex justify-center items-center gap-1">
                        <i class="fa-solid fa-rotate-right"></i> 新一輪 / 下一題
                    </button>
                </div>
            </div>

            <!-- 題目與遊戲狀態資訊 -->
            <div class="bg-white rounded-2xl p-6 shadow-sm border border-notion-pinkSubtle text-center space-y-2 relative overflow-hidden">
                <div class="absolute -right-4 -top-4 w-16 h-16 bg-notion-pinkLight rounded-full blur-xl"></div>
                <div id="statusTag" class="inline-block px-3 py-1 rounded-full text-xs font-medium bg-gray-100 text-gray-500 mb-1">
                    準備中...
                </div>
                <h2 id="displayQuestion" class="text-xl sm:text-2xl font-bold text-gray-800 tracking-wide min-h-[36px] flex items-center justify-center">
                    等待房主出題...
                </h2>
            </div>

            <!-- 玩家填答區 (Playing 階段顯示) -->
            <div id="playerAnswerArea" class="hidden bg-white rounded-2xl p-5 shadow-sm border border-notion-pinkSubtle space-y-3">
                <label class="block text-xs font-semibold text-gray-600">請輸入你的答案 (其他人開牌前看不到)：</label>
                <div class="flex gap-2">
                    <input type="text" id="inputPlayerAnswer" placeholder="輸入默契答案..." 
                        class="flex-grow px-4 py-2.5 rounded-xl border border-gray-200 text-sm focus:outline-none focus:ring-2 focus:ring-notion-pinkSoft/40">
                    <button id="btnSubmitAnswer" onclick="submitAnswer()" class="px-5 py-2.5 bg-notion-pinkMain hover:bg-notion-pinkHover text-white text-xs font-semibold rounded-xl shadow transition">
                        送出答案
                    </button>
                </div>
                <p id="submitStatusText" class="text-[11px] text-notion-subtext hidden flex items-center gap-1">
                    <i class="fa-solid fa-circle-check text-emerald-500"></i> 已成功送出答案，可重複修改再送出。
                </p>
            </div>

            <!-- 卡片展示區 (3D 翻牌 grid) -->
            <div class="space-y-3">
                <div class="flex justify-between items-center px-1">
                    <h3 class="text-xs font-bold text-gray-500 uppercase tracking-wider flex items-center gap-1.5">
                        <i class="fa-solid fa-users text-notion-pinkSoft"></i> 玩家卡片陣列 (<span id="playerCount">0</span>)
                    </h3>
                    <span id="pollingIndicator" class="text-[10px] text-notion-subtext flex items-center gap-1">
                        <i class="fa-solid fa-arrows-rotate animate-spin text-notion-pinkSoft"></i> 同步中...
                    </span>
                </div>

                <!-- 3D 翻牌容器 -->
                <div id="cardsGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
                    <!-- 玩家卡片動態插入於此 -->
                </div>

                <!-- 浮動等待提示 (當沒有卡片時) -->
                <div id="emptyState" class="text-center py-10 bg-white/50 rounded-2xl border border-dashed border-notion-pinkSubtle">
                    <i class="fa-solid fa-cloud-moon text-3xl text-notion-pinkSoft mb-2 animate-float"></i>
                    <p class="text-xs text-notion-subtext">目前還沒有玩家填答，等待大家加入中...</p>
                </div>
            </div>

        </section>

    </main>

    <!-- 頁尾資訊 -->
    <footer class="w-full max-w-4xl mx-auto p-4 text-center text-xs text-notion-subtext border-t border-notion-pinkSubtle/40">
        雲端心電感應 &copy; Notion-Style Minimal Telepathy Game
    </footer>

    <!-- 全局 Message Toast 提示框 (替代 alert) -->
    <div id="toast" class="fixed bottom-5 right-5 bg-gray-800 text-white text-xs px-4 py-3 rounded-xl shadow-lg transition-all duration-300 transform translate-y-20 opacity-0 flex items-center gap-2 z-50">
        <i id="toastIcon" class="fa-solid fa-circle-info"></i>
        <span id="toastMsg">提示訊息</span>
    </div>

    <!-- JavaScript 邏輯 -->
    <script>
        // 設定 Backend GAS API URL
        const SHEET_NAME = 'TelepathyData';
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbzTNw47bbTVHuIJN7b6gnsB1Mhz9t3O2wvgVjVEZdZt9gaW8MXE72gb401TpvKgqReU_w/exec";

        // 全局狀態變數
        let roomCode = '';
        let nickname = '';
        let isHost = false;
        let pollingTimer = null;
        let lastGameStatus = ''; // 紀錄上一次狀態，判斷翻牌時間
        let currentAnswersData = {};

        // 頁面載入完成後初始化
        window.onload = function() {
            // 從 URL 參數嘗試讀取房號
            const urlParams = new URLSearchParams(window.location.search);
            const roomParam = urlParams.get('room');
            if (roomParam) {
                document.getElementById('inputRoomCode').value = roomParam;
            }
        };

        // 隨機產生 4 位數字房號
        function generateRandomRoom() {
            const randomCode = Math.floor(1000 + Math.random() * 9000).toString();
            document.getElementById('inputRoomCode').value = randomCode;
        }

        // 加入/建立房間
        function joinRoom(asHost = false) {
            const nameInput = document.getElementById('inputNickname').value.trim();
            const roomInput = document.getElementById('inputRoomCode').value.trim();

            if (!nameInput) {
                showToast("請先輸入您的暱稱！", "warning");
                return;
            }
            if (!roomInput) {
                showToast("請輸入 4 位數房間代碼！", "warning");
                return;
            }

            nickname = nameInput;
            roomCode = roomInput;
            isHost = asHost;

            // 更新 UI Navbar
            document.getElementById('displayRoomCode').innerText = roomCode;
            document.getElementById('displayNickname').innerText = nickname;
            document.getElementById('navRight').classList.remove('hidden');
            
            updateRoleUI();

            // 切換視圖
            document.getElementById('lobbySection').classList.add('hidden');
            document.getElementById('gameSection').classList.remove('hidden');

            // 啟動輪詢 (Polling) 2秒一次
            fetchGameState();
            if (pollingTimer) clearInterval(pollingTimer);
            pollingTimer = setInterval(fetchGameState, 2000);

            showToast(`已成功進入房間：${roomCode}`);
        }

        // 切換隱藏房主身分
        function toggleHostRole() {
            isHost = !isHost;
            updateRoleUI();
            showToast(isHost ? "已切換為【房主】模式" : "已切換為【玩家】模式", "info");
        }

        // 更新身分標籤與主控台 UI
        function updateRoleUI() {
            const roleLabel = document.getElementById('roleLabel');
            const hostConsole = document.getElementById('hostConsole');
            
            if (isHost) {
                roleLabel.innerText = "房主";
                roleLabel.classList.add("text-amber-600", "font-bold");
                hostConsole.classList.remove('hidden');
            } else {
                roleLabel.innerText = "玩家";
                roleLabel.classList.remove("text-amber-600", "font-bold");
                hostConsole.classList.add('hidden');
            }
        }

        // 返回大廳 / 重置
        function resetToLobby() {
            if (pollingTimer) clearInterval(pollingTimer);
            document.getElementById('navRight').classList.add('hidden');
            document.getElementById('gameSection').classList.add('hidden');
            document.getElementById('lobbySection').classList.remove('hidden');
            lastGameStatus = '';
        }

        // --- GAS API 通訊 (GET & POST) ---

        // 輪詢獲取房間現狀 (GET)
        function fetchGameState() {
            const url = `${GAS_API_URL}?room=${encodeURIComponent(roomCode)}`;
            
            fetch(url)
                .then(res => res.json())
                .then(data => {
                    renderGameState(data);
                })
                .catch(err => {
                    console.error("Fetch Error:", err);
                });
        }

        // 向 GAS 發送指令 POST (使用 text/plain 避開 CORS preflight 問題)
        function sendPostAction(payload) {
            payload.room = roomCode;
            
            return fetch(GAS_API_URL, {
                method: "POST",
                headers: {
                    "Content-Type": "text/plain;charset=utf-8",
                },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .catch(err => {
                console.error("POST Error:", err);
            });
        }

        // --- 房主操作 Actions ---

        // 1. 發布題目
        function setQuestion() {
            const q = document.getElementById('inputQuestion').value.trim();
            if (!q) {
                showToast("請輸入題目內容！", "warning");
                return;
            }

            sendPostAction({
                action: "set_question",
                question: q
            }).then(() => {
                showToast("題目發布成功！");
                fetchGameState();
            });
        }

        // 2. 觸發開牌 (Reveal)
        function revealAnswers() {
            sendPostAction({
                action: "reveal"
            }).then(() => {
                showToast("已觸發開牌命令！");
                fetchGameState();
            });
        }

        // 3. 重置新一輪 (Reset)
        function resetRound() {
            sendPostAction({
                action: "reset"
            }).then(() => {
                document.getElementById('inputQuestion').value = '';
                document.getElementById('inputPlayerAnswer').value = '';
                showToast("遊戲已重置，請出新題目。");
                fetchGameState();
            });
        }

        // --- 玩家操作 Actions ---

        // 提交答案
        function submitAnswer() {
            const ans = document.getElementById('inputPlayerAnswer').value.trim();
            if (!ans) {
                showToast("請填寫答案再送出！", "warning");
                return;
            }

            sendPostAction({
                action: "submit_answer",
                playerName: nickname,
                answer: ans
            }).then(() => {
                document.getElementById('submitStatusText').classList.remove('hidden');
                showToast("答案已成功提交！");
                fetchGameState();
            });
        }

        // --- 畫面渲染邏輯 (Render Game State) ---

        function renderGameState(data) {
            const { status, question, answers } = data;
            currentAnswersData = answers || {};

            const statusTag = document.getElementById('statusTag');
            const displayQuestion = document.getElementById('displayQuestion');
            const playerAnswerArea = document.getElementById('playerAnswerArea');
            const hostSetupControls = document.getElementById('hostSetupControls');
            const hostActionControls = document.getElementById('hostActionControls');
            const emptyState = document.getElementById('emptyState');

            // 狀態顏色與標籤對應
            if (status === 'setup') {
                statusTag.className = "inline-block px-3 py-1 rounded-full text-xs font-semibold bg-amber-100 text-amber-700";
                statusTag.innerText = "📝 房主出題中";
                displayQuestion.innerText = question || "等待房主出題中...";
                
                playerAnswerArea.classList.add('hidden');
                hostSetupControls.classList.remove('hidden');
                hostActionControls.classList.add('hidden');
            } 
            else if (status === 'playing') {
                statusTag.className = "inline-block px-3 py-1 rounded-full text-xs font-semibold bg-blue-100 text-blue-700 animate-pulse";
                statusTag.innerText = "✏️ 玩家作答中";
                displayQuestion.innerText = `❓ ${question}`;
                
                playerAnswerArea.classList.remove('hidden');
                hostSetupControls.classList.add('hidden');
                hostActionControls.classList.remove('hidden');
            } 
            else if (status === 'revealed') {
                statusTag.className = "inline-block px-3 py-1 rounded-full text-xs font-semibold bg-emerald-100 text-emerald-700";
                statusTag.innerText = "🎉 已開牌！";
                displayQuestion.innerText = `❓ ${question}`;
                
                playerAnswerArea.classList.add('hidden');
                hostSetupControls.classList.add('hidden');
                hostActionControls.classList.remove('hidden');
            }

            // 更新卡片網格 (3D 翻牌 Core)
            renderCardsGrid(currentAnswersData, status === 'revealed');

            lastGameStatus = status;
        }

        // 渲染 3D 翻牌卡片
        function renderCardsGrid(answers, isRevealed) {
            const grid = document.getElementById('cardsGrid');
            const emptyState = document.getElementById('emptyState');
            const playerNames = Object.keys(answers);
            
            document.getElementById('playerCount').innerText = playerNames.length;

            if (playerNames.length === 0) {
                grid.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');

            // 現有 DOM 元素快速比對，避免重刷整個 DOM 遺失動畫
            playerNames.forEach(name => {
                const answerValue = answers[name];
                let cardEl = document.getElementById(`card-${name}`);

                if (!cardEl) {
                    // 建立新 3D 卡片 HTML 結構
                    const wrapper = document.createElement('div');
                    wrapper.id = `card-${name}`;
                    wrapper.className = "h-36 perspective-1000";

                    wrapper.innerHTML = `
                        <div class="card-inner shadow-md rounded-2xl ${isRevealed ? 'flipped' : ''}">
                            <!-- 卡片正面 (未開牌 / 背面圖樣) -->
                            <div class="card-front bg-gradient-to-br from-notion-pinkLight to-white border-2 border-notion-pinkSubtle p-4 flex flex-col justify-between items-center text-center">
                                <div class="w-full flex justify-between items-center text-[11px] text-notion-subtext">
                                    <span class="truncate max-w-[80px] font-medium text-gray-700">${escapeHtml(name)}</span>
                                    <i class="fa-solid fa-lock text-notion-pinkSoft"></i>
                                </div>
                                <div class="my-auto text-center">
                                    <div class="w-10 h-10 mx-auto rounded-full bg-notion-pinkSubtle/60 flex items-center justify-center text-notion-pinkMain text-base font-bold animate-float">
                                        💖
                                    </div>
                                    <span class="text-[10px] text-notion-subtext block mt-1">已蓋牌提交</span>
                                </div>
                            </div>
                            <!-- 卡片背面 (開牌 / 顯示答案) -->
                            <div class="card-back bg-white border-2 border-notion-pinkSoft p-4 flex flex-col justify-between items-center text-center shadow-lg">
                                <div class="w-full text-left text-[11px] font-bold text-notion-pinkMain truncate">
                                    👤 ${escapeHtml(name)}
                                </div>
                                <div class="my-auto px-1">
                                    <p class="text-base sm:text-lg font-bold text-gray-800 break-all leading-tight">
                                        ${escapeHtml(answerValue)}
                                    </p>
                                </div>
                                <div class="w-full text-right text-[9px] text-notion-subtext">
                                    心電感應答案
                                </div>
                            </div>
                        </div>
                    `;
                    grid.appendChild(wrapper);
                } else {
                    // 卡片已存在，更新翻牌狀態與內容
                    const inner = cardEl.querySelector('.card-inner');
                    const backText = cardEl.querySelector('.card-back p');
                    
                    if (backText) backText.innerText = answerValue;

                    if (isRevealed) {
                        inner.classList.add('flipped');
                    } else {
                        inner.classList.remove('flipped');
                    }
                }
            });

            // 移除已經離線或重新設定時不在名單內的卡片
            const currentCardIds = Array.from(grid.children).map(el => el.id);
            currentCardIds.forEach(id => {
                const nameInId = id.replace('card-', '');
                if (!answers.hasOwnProperty(nameInId)) {
                    const elToRemove = document.getElementById(id);
                    if (elToRemove) elToRemove.remove();
                }
            });
        }

        // HTML 轉義字串防護
        function escapeHtml(text) {
            if (!text) return '';
            return text
                .toString()
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // 顯示非阻塞式 Toast 提示框
        function showToast(msg, type = "info") {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            const toastIcon = document.getElementById('toastIcon');

            toastMsg.innerText = msg;
            
            if (type === 'warning') {
                toastIcon.className = "fa-solid fa-triangle-exclamation text-amber-400";
            } else {
                toastIcon.className = "fa-solid fa-circle-check text-notion-pinkSoft";
            }

            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }
    </script>
</body>
</html>
